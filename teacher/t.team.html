                <nav class="team-page-tabs" role="tablist" aria-label="Team collections">

                        Swarm

                <div class="team-page-tab-panels">
                    <section class="team-page-tab-panel active" id="coloniesPanel" role="tabpanel" aria-labelledby="coloniesTab">
                        <section class="group-section" id="ownedGroupsSection">
                            <div class="collection-row colony-collection-row">
                                <div id="colonyList" class="colony-list"></div>
                                <button class="section-add" type="button" id="openAddGroupModal" aria-label="Add colony">+</button>
                            </div>
                        </section>
                    </section>
                    <section class="team-page-tab-panel" id="teamsPanel" role="tabpanel" aria-labelledby="teamsTab" hidden>
                        <section class="group-section" id="joinedGroupsSection">
                            <div class="collection-row team-collection-row">
                                <div id="ownedGroupsList"></div>
                                <div id="joinedGroupsList"></div>
                                <button class="section-add" type="button" id="openCreateTeamModal" aria-label="Create swarm">+</button>
                            </div>
                        </section>
                    </section>
                </div>
            </div>
        </main>
        <aside class="right-rail" aria-hidden="true"></aside>
    </div>
    <div class="modal-overlay" id="addGroupModal" aria-hidden="true">
        <div class="group-modal" role="dialog" aria-modal="true" aria-labelledby="addGroupTitle">
            <div class="group-modal-header"><h2 id="addGroupTitle">Create Colony</h2></div>
            <div class="group-modal-form">
                <div class="group-form-field"><label for="groupNameInput">Colony Name:</label><input id="groupNameInput" type="text" placeholder="Enter colony name"></div>
                <div class="group-form-field"><label for="groupSubjectInput">Subject:</label><input id="groupSubjectInput" type="text" placeholder="Enter subject"></div>
                <div class="group-form-field"><label for="groupMottoInput">Colony Motto <span>(optional)</span>:</label><input id="groupMottoInput" type="text" placeholder="Enter a colony motto"></div>
                <div class="group-form-field"><label for="groupDescriptionInput">Description:</label><textarea id="groupDescriptionInput" rows="3" placeholder="Describe your colony" required></textarea></div>
                <div class="group-form-field"><label>Meeting Schedule <span>(optional)</span>:</label><div class="schedule-list" id="groupScheduleList"><div class="schedule-fields"><select name="groupScheduleDay" aria-label="Meeting day"><option value="">Day</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select><div class="schedule-time-group"><span>From</span><input name="groupScheduleFrom" type="time" aria-label="Meeting start time"></div><span class="schedule-time-separator">To</span><input class="schedule-end-time" name="groupScheduleTo" type="time" aria-label="Meeting end time"><button type="button" class="remove-schedule-btn" aria-label="Remove meeting schedule">×</button></div></div><button type="button" class="add-schedule-btn" id="addGroupScheduleBtn">+ Add Meeting Schedule</button></div>
                <div class="group-form-field"><label>Links <span>(optional)</span>:</label><div class="group-links-list" id="groupLinksList"></div><button type="button" class="add-group-link-btn" id="addGroupLinkBtn">+ Add Links</button></div>
                <div class="group-modal-actions"><button type="button" class="group-modal-btn group-discard-btn" id="discardAddGroup">Discard</button><button type="button" class="group-modal-btn group-create-btn" id="createAddGroup">Create Colony</button></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createTeamModal" aria-hidden="true">
        <div class="group-modal" role="dialog" aria-modal="true" aria-labelledby="createTeamTitle">
            <div class="group-modal-header"><h2 id="createTeamTitle">Create Swarm</h2></div>
            <form class="group-modal-form" id="createTeamForm">
                <div class="group-form-field"><label for="teamNameInput">Swarm Name:</label><input id="teamNameInput" name="teamName" type="text" placeholder="Enter swarm name" required></div>
                <div class="group-form-field"><label for="teamSubjectInput">Subject:</label><input id="teamSubjectInput" name="teamSubject" type="text" placeholder="Enter subject" required></div>
                <div class="group-form-field"><label for="teamMottoInput">Swarm Motto <span>(optional)</span>:</label><input id="teamMottoInput" name="teamMotto" type="text" placeholder="Enter a swarm motto"></div>
                <div class="group-form-field"><label for="teamDescriptionInput">Description:</label><textarea id="teamDescriptionInput" name="teamDescription" rows="3" placeholder="Describe your swarm" required></textarea></div>
                <div class="group-form-field"><label>Meeting Schedule <span>(optional)</span>:</label><div class="schedule-list" id="teamScheduleList"><div class="schedule-fields"><select name="teamScheduleDay" aria-label="Meeting day"><option value="">Day</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select><div class="schedule-time-group"><span>From</span><input name="teamScheduleFrom" type="time" aria-label="Meeting start time"></div><span class="schedule-time-separator">To</span><input class="schedule-end-time" name="teamScheduleTo" type="time" aria-label="Meeting end time"><button type="button" class="remove-schedule-btn" aria-label="Remove meeting schedule">×</button></div></div><button type="button" class="add-schedule-btn" id="addTeamScheduleBtn">+ Add Meeting Schedule</button></div>
                <div class="group-form-field"><label>Links <span>(optional)</span>:</label><div class="group-links-list" id="teamLinksList"></div><button type="button" class="add-group-link-btn" id="addTeamLinkBtn">+ Add Links</button></div>
                <div class="group-modal-actions"><button type="button" class="group-modal-btn group-discard-btn" id="discardCreateTeam">Discard</button><button type="submit" class="group-modal-btn group-create-btn" id="saveCreateTeam">Create Swarm</button></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../lib/auth-guard.js"></script>
    <script src="../lib/profile-dropdown.js"></script>
    <script src="../lib/datetime.js"></script>
    <script src="../lib/manage-profile.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="../lib/loading.js"></script>
    <script src="../lib/confirmation-modal.js"></script>
    <script src="t.dashb.js"></script>
