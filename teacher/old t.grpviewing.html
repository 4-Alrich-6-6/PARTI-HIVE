<!DOCTYPE html>
<html lang="en" style="visibility:hidden">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Information</title>
    <link rel="stylesheet" href="t.grpviewing.css">
    <link rel="stylesheet" href="../lib/loading.css">
    <script src="../lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../Logo.png">
    <link rel="icon" href="../Logo.png">
</head>
<body>
    <div class="topbar">
        <button class="menu-btn" id="topBackBtn" type="button" aria-label="Back to dashboard">
            <img src="../assets/Back.png" alt="Back icon">
        </button>
        <p class="datetime"></p>
    </div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="profile-block">
                <div class="avatar-circle">
                    <img src="../assets/profile.png" alt="Profile">
                </div>
                <h3></h3>
                <h3></h3>
                <a href="#" class="profile-link" data-no-loading>Manage Profile</a>
            </div>
            <div class="sidebar-actions">
                <button class="btn settings" type="button">Settings</button>
                <button class="btn logout" type="button">Log Out</button>
            </div>
        </aside>

        <main class="main-content-container">
            <div class="main-header">
                <h1 class="main-content-title">GROUP INFORMATION</h1>
                <div class="header-actions">
                    <button class="icon-btn danger" id="backBtn" type="button" aria-label="Leave group">
                        <img src="../assets/Leave.png" alt="Leave icon">
                    </button>
                </div>
            </div>

            <section class="main-content">
                <section class="summary-row">
                    <article class="summary-card">
                        <p class="summary-label">Members</p>
                        <h3>—</h3>
                    </article>
                    <article class="summary-card">
                        <p class="summary-label">Projects</p>
                        <h3>—</h3>
                    </article>
                </section>

                <section class="group-label-wrap">
                    <div class="group-label">
                        <h2></h2>
                        <p></p>
                    </div>
                </section>

                <section class="group-info-stack" id="groupInfoStack">
                    <p>Loading group information...</p>
                </section>
            </section>
        </main>

        <aside class="right-rail">
            <nav class="side-tabs" aria-label="Group sections">
                <button class="tab tab-group-info active" type="button"><img src="../assets/grpinfo.png" alt=""> <span>Group<br>Information</span></button>
                <button class="tab tab-project-breakdown" id="projectBreakdownTab" type="button"><img src="../assets/breakdown.png" alt=""> <span>Project<br>Breakdown</span></button>
            </nav>
        </aside>
    </div>

    <nav class="mobile-bottom-nav" aria-label="Section navigation">
        <button class="mob-nav-btn mob-nav-active" type="button" disabled>
            <img src="../assets/grpinfo.png" alt="">
            <span>Group Info</span>
        </button>
        <button class="mob-nav-btn" id="mobileBreakdownBtn" type="button">
            <img src="../assets/breakdown.png" alt="">
            <span>Breakdown</span>
        </button>
    </nav>

    <!-- Member Profile Modal -->
    <div class="modal-overlay" id="memberProfileOverlay" aria-hidden="true">
        <div class="confirmation-modal" role="dialog" aria-modal="true">
            <div class="confirmation-modal-header">
                <h2 id="memberProfileRole">Role</h2>
            </div>
            <div class="confirmation-modal-body" style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 18px;">
                <div class="circle-avatar large" id="memberProfileAvatar" style="flex-shrink:0;"></div>
                <div style="text-align:center;">
                    <p id="memberProfileName" style="margin:0 0 4px;font-weight:800;font-size:17px;"></p>
                    <p id="memberProfileField" style="margin:0 0 4px;font-size:14px;"></p>
                    <p id="memberProfileEmail" style="margin:0;font-size:13px;color:#555;word-break:break-all;"></p>
                </div>
            </div>
            <div class="confirmation-modal-actions" style="gap: 8px;">
                <button type="button" class="modal-btn confirm-btn" id="assignLeaderBtn">Assign as Leader</button>
                <button type="button" class="modal-btn discard-btn" id="removeMemberBtn">Remove from Group</button>
                <button type="button" class="modal-btn discard-btn" id="closeMemberProfileBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/loading.js"></script>
    <script src="../lib/datetime.js"></script>
    <script src="../lib/supabaseClient.js"></script>
    <script src="../lib/auth-guard.js"></script>
    <script src="../lib/manage-profile.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="../lib/confirmation-modal.js"></script>
    <script src="t.grpviewing.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
