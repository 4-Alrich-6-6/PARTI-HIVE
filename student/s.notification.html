<!DOCTYPE html>
<html lang="en" style="visibility:hidden">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="student-theme.css">
    <link rel="stylesheet" href="s.notification.css">
    <script src="../lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../Logo.png">
    <link rel="icon" href="../Logo.png">
</head>
<body>
    <div class="topbar">
        <button class="topbar-btn" id="topBackBtn" type="button" aria-label="Back">
            <img src="../assets/Back.png" alt="Back icon">
        </button>
        <p class="datetime">--:-- -- ---- --, ----</p>
    </div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <a class="brand-mark" href="s.dashb.html" aria-label="HIVE dashboard">
                <img src="../PrimeLogo.png" alt="HIVE">
            </a>
            <nav class="side-nav" aria-label="Main navigation">
                <a class="side-nav-link" href="s.dashb.html" aria-label="Dashboard"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="notification-tile-cutouts"><rect width="100" height="100" fill="#fff"/><circle cx="25" cy="25" r="13.5" fill="#000"/><rect x="63" y="13" width="24" height="24" fill="#000"/><polygon points="25,62 12.5,85 37.5,85" fill="#000"/><polygon points="75,61 89,75 75,89 61,75" fill="#000"/></mask></defs><g fill="currentColor" mask="url(#notification-tile-cutouts)"><rect x="3" y="3" width="44" height="44" rx="10"/><rect x="53" y="3" width="44" height="44" rx="10"/><rect x="3" y="53" width="44" height="44" rx="10"/><rect x="53" y="53" width="44" height="44" rx="10"/></g></svg><span>Dashboard</span></a>
                <a class="side-nav-link" href="s.team.html" aria-label="Teams"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M48 13H75A12 12 0 0 1 87 25V38M13 62V75A12 12 0 0 0 25 87H48" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="currentColor"><circle cx="32" cy="20" r="9.5"/><path d="M14 54C14 41 21 38 32 38S50 41 50 54Z"/><path d="M61 70C61 63 61 52 61 49C61 42 66 40 72 40S83 42 83 49V70C79 72 76 72 72 72S65 72 61 70Z"/><path d="M58 88C58 77 64 74 72 74S86 77 86 88Z"/></g></svg><span>Your Teams</span></a>
                <a class="side-nav-link" href="s.tasklist.html" aria-label="Tasks"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="5" y="5" width="25" height="25" rx="6"/><rect x="38" y="12.5" width="57" height="10" rx="5"/><rect x="5" y="37.5" width="25" height="25" rx="6"/><rect x="38" y="45" width="57" height="10" rx="5"/><rect x="38" y="77.5" width="57" height="10" rx="5"/><rect x="5" y="70" width="25" height="25" rx="6" fill="none" stroke="currentColor" stroke-width="7"/></g></svg><span>Pending Tasks</span></a>
            </nav>
            <nav class="side-nav side-nav-bottom" aria-label="Account navigation">
                <a class="side-nav-link notification-link notif-btn active" href="s.notification.html" aria-label="Notifications"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><circle cx="50" cy="16" r="7"/><path d="M50 18C33 18 24 33 24 50C24 58 20 64 20 64H80C80 64 76 58 76 50C76 33 67 18 50 18Z"/><rect x="13" y="70" width="74" height="6.5" rx="3.25"/><path d="M41.5 76.5A8.5 8.5 0 0 0 58.5 76.5Z"/></g></svg><span>Notifications</span><span class="notif-badge" aria-hidden="true"></span></a>
                <button class="side-nav-link settings-link settings" type="button" aria-label="Settings"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><circle cx="50" cy="50" r="32"/><rect x="43" y="10" width="14" height="12" rx="3.5"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(45 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(90 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(135 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(180 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(225 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(270 50 50)"/><rect x="43" y="10" width="14" height="12" rx="3.5" transform="rotate(315 50 50)"/></g><circle cx="50" cy="50" r="18" fill="#FFFBE4"/></svg><span>Settings</span></button>
            </nav>
        </aside>

        <main class="main-content-container">
            <div class="main-header">
                <div class="profile-row">
                    <button class="menu-btn" type="button" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
                        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><clipPath id="notificationHexClip"><polygon points="190,100 145,177.9 55,177.9 10,100 55,22.1 145,22.1"/></clipPath></defs><g clip-path="url(#notificationHexClip)" fill="#000"><rect x="0" y="30" width="200" height="24"/><rect x="0" y="88" width="200" height="24"/><rect x="0" y="146" width="200" height="24"/></g></svg>
                    </button>
                    <button class="profile-trigger" type="button" aria-label="Open profile menu"><img src="../assets/profile-placeholder.svg" alt=""><svg class="profile-chevron" viewBox="0 0 16 10" aria-hidden="true"><path d="M1 1.5 8 8.5 15 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
                <h1 class="main-content-title">Notification</h1>
                <div class="header-actions">
                    <button class="action-btn empty-notif-btn" id="emptyNotifBtn" type="button">
                        <span class="btn-icon">
                            <img src="../assets/Delete.png" alt="Delete icon">
                        </span>
                        <span>Delete All</span>
                    </button>
                    <button class="action-btn" id="markAllReadBtn" type="button">Mark all as Read</button>
                </div>
            </div>

            <div class="main-content">
                <section class="notif-section">
 

                    <div class="notif-list" id="notifList">
                        <!-- Empty State Placeholder -->
                        <div class="empty-state notification-empty-placeholder">
                            <img src="../assets/bee-flight.svg" class="empty-state-icon" alt="">
                            <h3>No notifications</h3>
                            <p>You're all caught up! No new notifications at the moment.</p>
                        </div>
                    </div>

                </section>
            </div>
        </main>

        <aside class="right-rail" aria-hidden="true"></aside>
    </div>

    <div class="modal-overlay" id="notifModalOverlay" aria-hidden="true">
        <div class="notif-modal" role="dialog" aria-modal="true" aria-labelledby="notifModalTitle">
            <div class="notif-modal-header">
                <h2 id="notifModalTitle">Notification</h2>
            </div>
            <div class="notif-modal-body">
                <p class="notif-modal-group"><strong>Group:</strong> <span id="notifModalGroup"></span></p>
                <p class="notif-modal-date"><strong>Date:</strong> <span id="notifModalDate"></span></p>
                <hr>
                <p class="notif-modal-bodytext" id="notifModalBody"></p>
            </div>
            <div class="notif-modal-actions">
                <button type="button" class="modal-btn discard-btn" id="closeNotifModalBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabaseClient.js"></script>
    <script src="../lib/auth-guard.js"></script>
    <script src="../lib/profile-dropdown.js"></script>
    <script src="../lib/datetime.js"></script>
    <script src="../lib/manage-profile.js"></script>
    <script src="../lib/settings.js"></script>
    <script src="../lib/notifications-data.js"></script>
    <script src="../lib/confirmation-modal.js"></script>
    <script src="s.notification.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
