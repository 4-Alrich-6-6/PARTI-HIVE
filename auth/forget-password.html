<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIVE - Forget Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kodchasan" rel="stylesheet">
    <link rel="stylesheet" href="log-sign.css">
    <script src="../lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../Logo.png">
    <link rel="icon" href="../Logo.png">
</head>
<body>
    <div class="bg-wrapper">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
    </div>

    <nav class="navbar">
        <a href="landing-page.html"><img class="title-logo" src="../PrimeLogo.png" alt="HIVE Title Logo"></a>
        <ul class="nav-links"></ul>
        <a href="log-sign.html" class="login-btn">Log In</a>
    </nav>

    <div class="container">
        <div class="right">
            <section class="form" aria-label="Forget password form">
                <div class="form-content">
                    <div class="form-heading-row">
                        <div class="back-button">
                            <a href="log-sign.html" id="backLink">
                                <img src="../assets/Back.png" alt="Back" class="back-icon">
                            </a>
                        </div>
                        <div class="form-title">
                            <h2>Reset Password</h2>
                        </div>
                    </div>
                    <div class="form-description">
                        <p>Enter your email to receive an OTP...</p>
                    </div>

                    <form id="step1Form" class="lForm active" autocomplete="on">
                        <div class="inputs">
                            <div class="form-group">
                                <div class="email-wrapper">
                                    <input id="email" type="email" placeholder="Enter Email" required>
                                    <button type="button" id="sendOtpBtn" class="send-btn">Send</button>
                                </div>
                            </div>
                            <div class="form-group password-group">
                                <label for="otp">Enter OTP:</label>
                                <div class="password-wrapper">
                                    <input id="otp" type="text" placeholder="######" class="otp-input" pattern="[0-9]{6}" maxlength="6" required>
                                </div>
                            </div>
                        </div>
                        <button class="submit" type="submit">Verify OTP</button>
                    </form>

                    <form id="step2Form" class="sForm" autocomplete="on" style="display: none;">
                        <div class="inputs">
                            <div class="form-group password-group">
                                <label for="newPass">New Password:</label>
                                <div class="password-wrapper">
                                    <input id="newPass" type="password" class="password-input" placeholder="Minimum 6 characters" minlength="6" required>
                                    <button class="toggle-password" type="button" aria-label="Toggle password visibility">
                                        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group password-group">
                                <label for="confirmPass">Confirm Password:</label>
                                <div class="password-wrapper">
                                    <input id="confirmPass" type="password" class="password-input" placeholder="Minimum 6 characters" minlength="6" required>
                                    <button class="toggle-password" type="button" aria-label="Toggle password visibility">
                                        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button class="submit" type="submit">Reset Password</button>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <section class="footer">
        <div class="footer">
            <p class="footer-text">© 2025 HIVE. All rights reserved.</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabaseClient.js"></script>
    <script src="forget-password.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
