<body class="task-list-page">

			</nav>

			<section class="main-content" aria-label="Pending tasks">
				<div id="taskList" class="task-list"><p class="loading-state">Loading tasks...</p></div>
			</section>
		</main>

	<script src="../lib/loading.js"></script>
	<script src="../lib/settings.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../lib/supabaseClient.js"></script>
	<script src="../lib/auth-guard.js"></script>
	<script src="../lib/profile-dropdown.js"></script>
	<script src="s.tasklist.js"></script>
	<script>
		const taskMenuButton = document.querySelector('.menu-btn');
		const taskSidebar = document.querySelector('#sidebar');
		taskMenuButton?.addEventListener('click', () => {
			const isOpen = taskSidebar?.classList.toggle('open') || false;
			taskMenuButton.setAttribute('aria-expanded', String(isOpen));
		});
	</script>
</body>
</html>
