<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hive Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fbfbf8;
      color: #000000;
      display: flex;
      min-height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 90px;
      background-color: #fbfbf8;
      border-right: 1px solid #e6e6df;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f5ab00;
      text-decoration: none;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
    }

    .logo-sub {
      font-size: 5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
      text-align: center;
      line-height: 1.1;
      max-width: 50px;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .nav-item {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-item.active {
      background-color: #e5b000;
    }

    /* --- Main Layout --- */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 40px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background-color: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 0 40px 40px 40px;
      max-width: 1000px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* --- Stat Cards --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      padding: 16px 18px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 120px;
    }

    .stat-card.yellow {
      background-color: #f7fcbe;
      border: 1px solid #e3ea9e;
    }

    .stat-card.green {
      background-color: #d6f8d6;
      border: 1px solid #bce1bc;
    }

    .stat-card.pink {
      background-color: #fcdbdc;
      border: 1px solid #f2bebf;
    }

    .stat-label {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .stat-value {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
    }

    /* --- Sections --- */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* --- Ratings Card --- */
    .ratings-card {
      background-color: #ffffff;
      border: 1px solid #d1d1d1;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .ratings-metrics {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .metric-row {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .score-grade {
      font-size: 96px;
      font-weight: 800;
      line-height: 0.8;
      margin-right: 40px;
    }

    /* --- Visited Team Card --- */
    .team-card {
      width: 270px;
      border: 1px solid #d1d1d1;
      border-radius: 10px;
      overflow: hidden;
    }

    .team-card-top {
      background-color: #ffffff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
    }

    .team-card-bottom {
      background-color: #f7fcbe;
      padding: 14px 20px;
      border-top: 1px solid #e3ea9e;
    }

    .team-lead {
      font-size: 14px;
      font-weight: 600;
      color: #8c8c73;
      margin-bottom: 4px;
    }

    .team-members {
      font-size: 12px;
      font-weight: 500;
      color: #a3a38a;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-title">HIVE</div>
      <div class="logo-sub">Where Teamwork Thrives!</div>
    </div>

    <nav class="nav-section">
      <!-- Active App Grid Icon -->
      <div class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <circle cx="17.5" cy="6.5" r="3.5" />
          <polygon points="6.5,14 3,20 10,20" />
          <rect x="14" y="14" width="7" height="7" transform="rotate(45 17.5 17.5)" />
        </svg>
      </div>
      <!-- User Group Icon -->
      <div class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#e5b000">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </div>
      <!-- List Icon -->
      <div class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#e5b000">
          <path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6s-.67-1.5-1.5-1.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/>
        </svg>
      </div>
    </nav>

    <div class="nav-section">
      <!-- Bell Icon -->
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#e5b000">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
      </div>
      <!-- Settings Icon -->
      <div class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#e5b000">
          <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
        </svg>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-container">
    <header>
      <div class="user-profile">
        <div class="user-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#666">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
        </svg>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">Dashboard</h1>

      <!-- Stats Grid -->
      <section class="stats-grid">
        <div class="stat-card yellow">
          <span class="stat-label">Teams</span>
          <span class="stat-value">05</span>
        </div>
        <div class="stat-card yellow">
          <span class="stat-label">Your Teams</span>
          <span class="stat-value">03</span>
        </div>
        <div class="stat-card green">
          <span class="stat-label">Completed Tasks</span>
          <span class="stat-value">11</span>
        </div>
        <div class="stat-card pink">
          <span class="stat-label">Pending Tasks</span>
          <span class="stat-value">01</span>
        </div>
      </section>

      <!-- Your Ratings -->
      <section>
        <h2 class="section-title">Your Ratings</h2>
        <div class="ratings-card">
          <div class="ratings-metrics">
            <div class="metric-row">Total Tasks Recieved:</div>
            <div class="metric-row">Total Tasks Completed:</div>
            <div class="metric-row">Total Tasks Missed:</div>
          </div>
          <div class="score-label">Avarage Score:</div>
          <div class="score-grade">A</div>
        </div>
      </section>

      <!-- Recently Visited Team -->
      <section>
        <h2 class="section-title">Your Recently Visited Team</h2>
        <div class="team-card">
          <div class="team-card-top">
            <span>Team 7</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#888">
              <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
            </svg>
          </div>
          <div class="team-card-bottom">
            <div class="team-lead">Mr. Alrits Teaxson</div>
            <div class="team-members">12 members</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../lib/supabaseClient.js"></script>
  <script src="../lib/auth-guard.js"></script>
</body>
</html>
