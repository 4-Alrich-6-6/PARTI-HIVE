<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Information</title>
    <link rel="stylesheet" href="s.membergrpviewing.css">
    <link rel="stylesheet" href="../../lib/loading.css">
    <link rel="stylesheet" href="../student-theme.css">
</head>
<body>
    <div class="topbar">
        <button class="menu-btn" id="topBackBtn" type="button" aria-label="Back to dashboard">
            <img src="../../assets/Back.png" alt="Back icon">
        </button>
        <p class="datetime">6:00 PM February 01, 2026</p>
    </div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="profile-block">
                <div class="avatar-circle">
                    <img src="../../assets/profile.png" alt="Profile">
                </div>
                <h3>Name</h3>
                <h3>Email</h3>
                <a href="#" class="profile-link" data-no-loading>Manage Profile</a>
            </div>

            <div class="sidebar-actions">
                <button class="btn settings" type="button">Settings</button>
                <button class="btn logout" type="button">Log Out</button>
            </div>
        </aside>

        <main class="main-content-container">
            <div class="main-header">
                <h1 class="main-content-title">GROUP INFORMATION</h1>

                <div class="header-actions">
                    <button class="action-btn leave-btn" type="button">Ask to Leave</button>
                </div>
            </div>

            <section class="main-content">
                <section class="summary-row">
                    <article class="summary-card">
                        <p class="summary-label">Instructor</p>
                        <h3>0</h3>
                    </article>

                    <article class="summary-card">
                        <p class="summary-label">Members</p>
                        <h3>3</h3>
                    </article>

                    <article class="summary-card">
                        <p class="summary-label">Projects</p>
                        <h3>1</h3>
                    </article>
                </section>

                <section class="group-label-wrap">
                    <div class="group-label">
                        <h2>Group Name</h2>
                        <p>Subject</p>
                    </div>
                </section>

                <section class="group-info-stack" id="groupInfoStack">
                  <p>Loading group information...</p>
                </section>
            </section>
        </main>

        <aside class="right-rail">
            <nav class="side-tabs" aria-label="Group sections">
                <button class="tab tab-group-info active" type="button">Group<br>Information</button>
                <button class="tab tab-project-breakdown" id="projectBreakdownTab" type="button">Project<br>Breakdown</button>
            </nav>
        </aside>
    </div>

    <script src="../../lib/loading.js"></script>
    <script src="../../lib/datetime.js"></script>
    <script src="../../lib/manage-profile.js"></script>
    <script src="../../lib/settings.js"></script>
    <script src="../../lib/confirmation-modal.js"></script>
    <script src="../../lib/supabaseClient.js"></script>
    <script src="s.membergrpviewing.js"></script>
</body>
</html>
