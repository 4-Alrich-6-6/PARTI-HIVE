<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kodchasan:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profiling.css">
    <script src="/lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../Logo.png">
    <link rel="icon" href="../Logo.png">
</head>
<body>
    <div class="profiling-page">
        <div class="bg-wrapper" aria-hidden="true">
            <div class="bg-left"></div>
            <div class="bg-right"></div>
        </div>
        <nav class="navbar">
            <img class="title-logo" src="../PrimeLogo.png" alt="HIVE Title Logo">
        </nav>
        <main class="profiling-main">
            <section class="profiling-card" aria-labelledby="profiling-title">
                <h1 id="profiling-title">Welcome to<br>HIVE</h1>
                <p class="profiling-prompt">To continue, please select a role.</p>
                <div class="options" id="positionOptions">
                    <p class="loading-option">Loading...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabaseClient.js"></script>
    <script src="../lib/auth-guard.js"></script>
    <script src="profiling.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
