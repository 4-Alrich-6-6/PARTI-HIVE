<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIVE Tutorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kodchasan:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tutorial.css">
    <script src="../../lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../../Logo.png">
    <link rel="icon" href="../../Logo.png">

    <style>
        .bg-wrapper{position:fixed;top:250px;left:-300px;width:200vw;height:100vh;display:flex;z-index:-1;overflow:visible}
        .bg-left{position:static;width:70vw;height:100vh;background-image:url('../assets/primesubmark.png');background-size:cover;background-position:center;opacity:25%}
        .bg-right{position:static;width:40vw;height:60vh;background-image:url('../assets/collab.png');background-size:cover;background-position:center;opacity:25%}
        .navbar{width:100%;min-height:90px;height:auto;padding:1px clamp(16px,8%,120px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;border-bottom:1px solid #BFBCBC}
        .title-logo{width:clamp(88px,12vw,130px);height:auto;display:block}
        .tutorial-main{min-height:calc(100vh - 93px);padding:clamp(22px,4vw,30px) clamp(14px,4vw,18px);align-items:flex-start}
        .tutorial-card{width:min(100%,410px);padding:clamp(28px,4vw,44px) clamp(20px,4vw,42px) 34px;border-radius:9px;margin:clamp(28px,5vw,70px) auto 0}
        @media (max-width:760px){.navbar{min-height:68px;padding:10px 16px}.tutorial-main{min-height:calc(100vh - 67px)}.tutorial-card{width:min(calc(100vw - 36px),390px);padding:36px 26px 28px;margin-top:34px}.tutorial-skip{top:-38px;right:0}}
        @media (max-width:430px){.tutorial-main{padding:22px 14px 36px}.tutorial-card{width:100%;padding:30px 18px 24px}.tutorial-card h1{font-size:34px}.tutorial-tab{font-size:12px}.tutorial-step{padding-inline:4px}.tutorial-step h2{font-size:18px}.tutorial-step p{font-size:14px}.tutorial-arrow{width:48px}}
    </style>
    <script src="/lib/offline-banner.js" defer></script>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../Logo.png">
    <link rel="icon" href="../Logo.png">
</head>
<body>
    <div class="profiling-page">
        <div class="bg-wrapper" aria-hidden="true">
            <div class="bg-left"></div>
            <div class="bg-right"></div>
        </div>
        <nav class="navbar">
            <img class="title-logo" src="../PrimeLogo.png" alt="HIVE Title Logo">
        </nav>
        <main class="tutorial-main">
            <section class="tutorial-card" aria-labelledby="tutorial-title">
                 <h1 id="tutorial-title">Tutorial</h1>
                <div id="tutorialContent"></div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../lib/supabaseClient.js"></script>
    <script src="../lib/auth-guard.js"></script>
    <script src="tutorial.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
